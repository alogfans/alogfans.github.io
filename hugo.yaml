      description: "Storage for AI | Author of Mooncake TE"
      homeInfoParams:
        Title: "Feng Ren"
        Content: >
          Storage for AI | Author of [Mooncake TE](https://github.com/kvcache-ai/Mooncake)
    menu:
      main:
        - identifier: archives
          name: Archives
          url: /archives/
          weight: 10
        - identifier: about
          name: About
          url: /about/
          weight: 20
        - identifier: rdma101
          name: RDMA101
          url: http://renfeng.org/RDMA101/
          weight: 30
  zh:
    label: 中文
    weight: 2
    params:
      description: "AI 存储系统 | Mooncake 传输引擎作者"
      homeInfoParams:
        Title: "Feng Ren"
