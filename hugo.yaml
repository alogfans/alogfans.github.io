params:
  mainSections:
    - zh
    - en
  comments: true
  label:
    icon: /favicon.svg
    iconHeight: 24
  profileMode:
    enabled: false
  displayFullLangName: true
  showAllLanguagesInHome: true
  disableLangToggle: false
  socialIcons:
    - name: "github"
      url: "https://github.com/alogfans"
    - name: "email"
      url: "mailto:renfeng.chn+bot@outlook.com"

markup:
  highlight:
    style: tango
    noClasses: false
    guessSyntax: true
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
    extensions:
      passthrough:
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
        enable: true
