  zh:
    label: 中文
    weight: 2
    params:
      description: "AI 基础设施、KVCache、RDMA 与存储系统的技术笔记"
      homeInfoParams:
        Title: "Feng Ren"
        Content: >
          AI 基础设施工程师，参与 [Mooncake](https://github.com/kvcache-ai/Mooncake) 开源项目并负责 Transfer Engine。这里记录 KVCache、RDMA、存储及系统工程方面的技术笔记。
