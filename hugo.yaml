baseURL: https://renfeng.org/
defaultContentLanguage: zh
title: Feng Ren
theme: PaperMod

languages:
  en:
    label: English
    weight: 1
    params:
      description: "Storage for AI Research | Founder of Mooncake Transfer Engine"
      homeInfoParams:
        Title: "Feng Ren"
        Content: >
          Storage for AI Researcher | Founder of [Mooncake Transfer Engine](https://github.com/kvcache-ai/Mooncake)
    menu:
      main:
        - identifier: archives
          name: Archives
          url: /archives/
          weight: 10
        - identifier: about
          name: About
          url: /about/
          weight: 20
  zh:
    label: 中文
    weight: 2
    params:
      description: "AI 存储系统研究者 | Mooncake 传输引擎创始人"
      homeInfoParams:
        Title: "Feng Ren"
        Content: >
          AI 存储系统研究者 | [Mooncake 传输引擎](https://github.com/kvcache-ai/Mooncake) 创始人
    menu:
      main:
        - identifier: archives
          name: Archives
          url: /archives/
          weight: 10
        - identifier: about
          name: About
          url: /about/
          weight: 20

params:
  comments: true
  profileMode:
    enabled: false
  displayFullLangName: true
  showAllLanguagesInHome: true
  disableLangToggle: false
  socialIcons:
    - name: "github"
      url: "https://github.com/alogfans"
    - name: "email"
      url: "mailto:renfeng.chn+bot@outlook.com"

markup:
  highlight:
    style: tango
    noClasses: false
    guessSyntax: true
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
    extensions:
      passthrough:
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
        enable: true

