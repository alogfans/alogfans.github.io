name: Validate Hugo Site

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with theme submodule
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build site without deploying
        run: hugo --minify
      - name: Verify language switching, posts, and public URLs
        run: python3 scripts/validate_site.py
      - name: Upload rendered preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hugo-preview
          path: public/
          retention-days: 7
