name: Validate Hugo Site

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with theme submodule
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build site without deploying
        run: hugo --minify
      - name: Verify bilingual homepages and native PaperMod post lists
        run: |
          for page in public/index.html public/en/index.html; do
            test -s "$page" || { echo "::error::$page is missing"; exit 1; }
            echo "Checking $page"
            grep -q 'home-info' "$page" || { echo "::error::$page has no PaperMod home-info section"; exit 1; }
            grep -q 'post-entry' "$page" || { echo "::error::$page has no post-entry list"; exit 1; }
          done
